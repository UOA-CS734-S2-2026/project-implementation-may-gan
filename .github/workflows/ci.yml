name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

# Pull request code is intentionally limited to read-only repository access. This
# workflow does not receive deployment credentials, environment secrets, or write
# permissions, and it must never be changed to pull_request_target.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check draft legal content parity
        run: pnpm legal:check
      - name: Test draft legal release gate
        run: pnpm legal:test
      - name: Lint
        run: pnpm lint
      - name: Test web E2E isolation contract
        run: pnpm test:web-e2e-contract
      - name: Generate Next.js route types
        run: pnpm --filter @dayli/web exec next typegen
      - name: Typecheck
        run: pnpm typecheck
      - name: Test all workspace packages
        run: pnpm test
      - name: Test local workerd browser proxy boundary
        run: pnpm --filter @dayli/api test:proxy-integration
      - name: Test local source-provenance diagnostics
        run: pnpm test:proxy-provenance
      - name: Test staging release workflow contract
        run: pnpm test:staging-release-contract
      - name: Test realtime API when present
        shell: bash
        run: |
          set -euo pipefail
          if node -e 'const scripts = require("./apps/api/package.json").scripts ?? {}; process.exit(scripts["test:realtime"] ? 0 : 1)'; then
            pnpm --filter @dayli/api test:realtime
          else
            echo 'No @dayli/api test:realtime script is defined. Skipping.'
          fi
      - name: Build
        run: pnpm build

  web-e2e:
    name: Web E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @dayli/web exec playwright install --with-deps chromium
      - name: Run isolated web browser journeys
        run: pnpm test:e2e:web
      - name: Upload Playwright failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-failure-${{ github.run_attempt }}
          path: apps/web/test-results
          if-no-files-found: warn
          retention-days: 7

  contracts-and-flutter:
    name: Contracts and Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # apps/mobile/pubspec.lock requires Flutter 3.47 or later. Pin the local
      # verified 3.47.2 toolchain rather than following the stable channel.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Verify generated API contracts and clients
        run: pnpm generate:clients:check
      - name: Check generated Dart client
        working-directory: packages/api-client-dart
        run: |
          dart pub get
          dart analyze
          dart test
      - name: Check Flutter application
        working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test
          flutter build apk --debug

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || format('{0}~1', github.sha) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run isolated PostgreSQL migration and integration checks
        run: bash scripts/verify-postgres.sh
