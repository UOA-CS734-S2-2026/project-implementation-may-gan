name: Deploy docs

# Deploy only the main commit that passed CI. PRs never receive deploy credentials.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  docs-changed:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Check whether docs changed
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          previous_sha=""
          while read -r deployment_id deployment_sha; do
            status="$(gh api \
              "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses?per_page=1" \
              --jq '.[0].state // ""')"
            if [[ "$status" == "success" ]]; then
              previous_sha="$deployment_sha"
              break
            fi
          done < <(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/deployments?environment=docs-production&per_page=100" \
            --jq '.[] | "\(.id) \(.sha)"')

          if [[ -z "$previous_sha" ]] ||
             ! git merge-base --is-ancestor "$previous_sha" "$CURRENT_SHA"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$previous_sha" "$CURRENT_SHA" -- apps/docs/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: docs-changed
    if: >-
      needs.docs-changed.outputs.changed == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    environment: docs-production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate docs Worker target
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node <<'NODE'
          import { readFileSync } from 'node:fs';

          if (!/^[a-f0-9]{32}$/.test(process.env.CLOUDFLARE_ACCOUNT_ID ?? '')) {
            throw new Error('docs-production must provide a valid CLOUDFLARE_ACCOUNT_ID.');
          }
          const config = JSON.parse(readFileSync('apps/docs/wrangler.jsonc', 'utf8'));
          if (config.name !== 'dayli-docs' || config.main !== '.open-next/worker.js'
            || config.assets?.binding !== 'ASSETS'
            || config.assets?.directory !== '.open-next/assets'
            || config.services?.length !== 1
            || config.services[0]?.binding !== 'WORKER_SELF_REFERENCE'
            || config.services[0]?.service !== config.name
            || config.routes || config.route || config.account_id
            || config.hyperdrive || config.r2_buckets || config.d1_databases
            || !config.compatibility_flags?.includes('nodejs_compat')) {
            throw new Error('Refusing an unexpected docs Worker target or binding.');
          }
          NODE
      - name: Check and build docs Worker
        run: |
          pnpm --filter docs lint
          pnpm --filter docs exec opennextjs-cloudflare build
      - name: Deploy docs Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo 'docs-production must provide CLOUDFLARE_API_TOKEN.' >&2
            exit 1
          fi
          pnpm --filter docs exec opennextjs-cloudflare deploy
