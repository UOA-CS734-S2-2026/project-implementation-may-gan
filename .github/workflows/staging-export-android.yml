name: Build staging export Android tester APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require explicit staging activation and exact API origin
        env:
          APPROVAL: ${{ vars.STAGING_EXPORT_ALL_USERS_APPROVED }}
          API_ORIGIN: ${{ vars.STAGING_AUTH_API_ORIGIN }}
        run: |
          if [[ "$APPROVAL" != 'all-staging-accounts' || "$API_ORIGIN" != 'https://api.staging.dayli.agroupforcoders.com' ]]; then
            echo 'Staging export tester build is unavailable.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true
      - name: Build staging-only Android debug APK
        working-directory: apps/mobile
        env:
          API_ORIGIN: ${{ vars.STAGING_AUTH_API_ORIGIN }}
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --debug \
            --dart-define=DAYLI_API_BASE_URL="$API_ORIGIN" \
            --dart-define=DAYLI_STAGING_EXPORT_APPROVED=true
      - uses: actions/upload-artifact@v4
        with:
          name: staging-export-android-${{ github.sha }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
          if-no-files-found: error
