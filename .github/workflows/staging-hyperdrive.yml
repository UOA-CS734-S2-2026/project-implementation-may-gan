name: Deploy staging API and Hyperdrive proof

# Called only by staging-release.yml. Do not add independent dispatch or CI
# triggers because API and web must use the same captured mode and commit.
on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      browser_proxy_enabled:
        required: true
        type: string
      tooling_sha:
        required: true
        type: string

permissions:
  contents: read

# Shares the staging database-state lock with the manual migration workflow.
# The caller has a separate release lock, so this does not recurse through a
# reusable workflow or serialize production.
concurrency:
  group: staging-database-state-staging
  cancel-in-progress: false

jobs:
  deploy:
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - name: Validate captured browser proxy mode
        env:
          CAPTURED_BROWSER_PROXY_ENABLED: ${{ inputs.browser_proxy_enabled }}
          STAGING_BROWSER_PROXY_ENABLED: ${{ vars.STAGING_BROWSER_PROXY_ENABLED || 'false' }}
        run: |
          if [[ "$CAPTURED_BROWSER_PROXY_ENABLED" != "true" && "$CAPTURED_BROWSER_PROXY_ENABLED" != "false" ]]; then
            echo 'Captured browser proxy mode must be true or false.' >&2
            exit 1
          fi
          if [[ "$CAPTURED_BROWSER_PROXY_ENABLED" != "$STAGING_BROWSER_PROXY_ENABLED" ]]; then
            echo 'Captured browser proxy mode no longer matches staging.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Check out immutable release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tooling_sha }}
          path: deployment-tooling
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: deployment-tooling
      - name: Verify direct migrator target matches configured Hyperdrive
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_STAGING_HYPERDRIVE_ID: ${{ secrets.CLOUDFLARE_STAGING_HYPERDRIVE_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node deployment-tooling/scripts/verify-staging-schema-target.mjs
      - name: Verify the captured release schema before deployment
        env:
          MIGRATION_TARGET: staging
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATIONS_DIR: ${{ github.workspace }}/packages/db/migrations
        run: pnpm --dir deployment-tooling db:verify
      - name: Validate staging resource and generate configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_STAGING_HYPERDRIVE_ID: ${{ secrets.CLOUDFLARE_STAGING_HYPERDRIVE_ID }}
          STAGING_API_SERVICE_NAME: ${{ vars.STAGING_API_SERVICE_NAME }}
          STAGING_HYPERDRIVE_NAME: ${{ vars.STAGING_HYPERDRIVE_NAME }}
          STAGING_AUTH_API_ORIGIN: ${{ vars.STAGING_AUTH_API_ORIGIN }}
          STAGING_AUTH_WEB_ORIGIN: ${{ vars.STAGING_AUTH_WEB_ORIGIN }}
          STAGING_AUTH_SITE_HOST: ${{ vars.STAGING_AUTH_SITE_HOST }}
          STAGING_BROWSER_PROXY_ENABLED: ${{ inputs.browser_proxy_enabled }}
          STAGING_GOOGLE_WEB_CLIENT_ID: ${{ vars.STAGING_GOOGLE_WEB_CLIENT_ID }}
          STAGING_GOOGLE_IOS_CLIENT_ID: ${{ vars.STAGING_GOOGLE_IOS_CLIENT_ID }}
          STAGING_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.STAGING_GOOGLE_ANDROID_CLIENT_ID }}
          STAGING_RESEND_FROM: ${{ vars.STAGING_RESEND_FROM }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          STAGING_R2_BUCKET_NAME: ${{ vars.STAGING_R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/run-staging-api-deploy.mjs
      - name: Dry-run generated Worker configurations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm --dir apps/api exec wrangler deploy --dry-run --config wrangler.staging.jsonc
          pnpm --dir apps/api exec wrangler deploy --dry-run --config wrangler.hyperdrive-test.jsonc
      - name: Synchronize reviewed Worker secrets after configuration dry-runs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_STAGING_HYPERDRIVE_ID: ${{ secrets.CLOUDFLARE_STAGING_HYPERDRIVE_ID }}
          STAGING_API_SERVICE_NAME: ${{ vars.STAGING_API_SERVICE_NAME }}
          STAGING_HYPERDRIVE_NAME: ${{ vars.STAGING_HYPERDRIVE_NAME }}
          STAGING_AUTH_API_ORIGIN: ${{ vars.STAGING_AUTH_API_ORIGIN }}
          STAGING_AUTH_WEB_ORIGIN: ${{ vars.STAGING_AUTH_WEB_ORIGIN }}
          STAGING_AUTH_SITE_HOST: ${{ vars.STAGING_AUTH_SITE_HOST }}
          STAGING_GOOGLE_WEB_CLIENT_ID: ${{ vars.STAGING_GOOGLE_WEB_CLIENT_ID }}
          STAGING_GOOGLE_IOS_CLIENT_ID: ${{ vars.STAGING_GOOGLE_IOS_CLIENT_ID }}
          STAGING_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.STAGING_GOOGLE_ANDROID_CLIENT_ID }}
          STAGING_RESEND_FROM: ${{ vars.STAGING_RESEND_FROM }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          STAGING_R2_BUCKET_NAME: ${{ vars.STAGING_R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/sync-staging-api-secrets.mjs
      - name: Deploy the reviewed staging API Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --dir apps/api exec wrangler deploy --config wrangler.staging.jsonc
      - name: Run the Workers Hyperdrive check
        id: proof
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @dayli/api test:hyperdrive:staging
      - name: Write sanitized Hyperdrive evidence
        env:
          PROOF_STEP_OUTCOME: ${{ steps.proof.outcome }}
          DEPLOYED_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          if (process.env.PROOF_STEP_OUTCOME !== 'success') throw new Error('Refusing evidence without a successful private Worker proof.');
          if (!/^[a-f0-9]{40}$/.test(process.env.DEPLOYED_COMMIT_SHA ?? '')) throw new Error('Refusing evidence without a valid deployed commit SHA.');
          const api = JSON.parse(readFileSync('apps/api/package.json', 'utf8'));
          const root = JSON.parse(readFileSync('package.json', 'utf8'));
          writeFileSync('apps/api/hyperdrive-proof-evidence.json', JSON.stringify({
            commitSha: process.env.DEPLOYED_COMMIT_SHA,
            target: 'staging', timestamp: new Date().toISOString(), pass: true,
            checks: ['select_1_through_hyperdrive', 'transaction_commit_and_rollback', 'constraint_classes_and_role_permissions', 'fresh_invocation_visibility_and_cleanup'],
            versions: { node: process.version, pnpm: root.packageManager, wrangler: api.devDependencies.wrangler, workersVitestPlugin: api.devDependencies['@cloudflare/vitest-plugin'], vitest: api.devDependencies.vitest, compatibilityDate: '2026-03-10' },
          }, null, 2));
          NODE
      - name: Upload sanitized Hyperdrive evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hyperdrive-proof-${{ inputs.commit_sha }}-${{ github.run_attempt }}
          path: apps/api/hyperdrive-proof-evidence.json
          retention-days: 90
          if-no-files-found: warn
