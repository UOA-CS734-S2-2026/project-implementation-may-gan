name: Staging Hyperdrive integration

# This credentialed proof is deliberately manual until the separate Neon staging
# project is provisioned. Do not add automatic PR or push triggers without that
# provisioning and an explicit review of the deployment boundary.
on:
  workflow_dispatch:

permissions:
  contents: read

# A PR's runs are serialized, so an older cleanup cannot delete a newer preview.
# Main and manual staging runs share a separate lock.
concurrency:
  group: staging-hyperdrive-${{ github.event.pull_request.number || 'staging' }}
  cancel-in-progress: false

jobs:
  require-main:
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-main dispatch
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != refs/heads/main ]]; then
            echo 'Staging deployment requires a manual dispatch from main.' >&2
            exit 1
          fi
  changes:
    needs: require-main
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_dispatch ]]; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          else
            base="$BEFORE"; [[ "$EVENT" == pull_request ]] && base="$BASE"
            if git diff --name-only "$base" "$SHA" | grep -Eq '^(apps/api/|packages/db/|pnpm-lock.yaml$|.github/workflows/staging-hyperdrive.yml$)'; then
              echo 'relevant=true' >> "$GITHUB_OUTPUT"
            else
              echo 'relevant=false' >> "$GITHUB_OUTPUT"
            fi
          fi

  check:
    needs: changes
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.relevant == 'true' &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false))
    # Do not use pull_request_target. Forks never receive the staging environment
    # or its credentials. Same-repository PR branches are the trusted PR source.
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write and validate credentialed Wrangler configurations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_STAGING_HYPERDRIVE_ID: ${{ secrets.CLOUDFLARE_STAGING_HYPERDRIVE_ID }}
          STAGING_API_SERVICE_NAME: ${{ vars.STAGING_API_SERVICE_NAME }}
          STAGING_HYPERDRIVE_NAME: ${{ vars.STAGING_HYPERDRIVE_NAME }}
          STAGING_AUTH_API_ORIGIN: ${{ vars.STAGING_AUTH_API_ORIGIN }}
          STAGING_AUTH_WEB_ORIGIN: ${{ vars.STAGING_AUTH_WEB_ORIGIN }}
          STAGING_AUTH_SITE_HOST: ${{ vars.STAGING_AUTH_SITE_HOST }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node <<'NODE'
          import { writeFileSync } from "node:fs";
          import { validateStagingOrigins } from "./scripts/staging-origins.mjs";

          const expectedStagingWorkerName = "dayli-api-staging";
          const workerNamePattern = /^[a-z][a-z0-9-]{0,62}$/;
          const idPattern = /^[a-f0-9]{32}$/;
          const hyperdriveNamePattern = /^[A-Za-z0-9][A-Za-z0-9 ._-]{0,62}$/;

          function required(name) {
            const value = process.env[name];
            if (!value) throw new Error(`The staging environment must provide ${name}.`);
            return value;
          }

          function assertWorkerName(name) {
            if (!workerNamePattern.test(name)) {
              throw new Error("Refusing an invalid Worker name.");
            }
          }

          const accountId = required("CLOUDFLARE_ACCOUNT_ID");
          const apiToken = required("CLOUDFLARE_API_TOKEN");
          const hyperdriveId = required("CLOUDFLARE_STAGING_HYPERDRIVE_ID");
          const configuredStagingWorkerName = required("STAGING_API_SERVICE_NAME");
          const expectedHyperdriveName = required("STAGING_HYPERDRIVE_NAME");
          const { apiOrigin: authApiOrigin, webOrigin: authWebOrigin } = validateStagingOrigins({
            siteHost: required("STAGING_AUTH_SITE_HOST"),
            apiOrigin: required("STAGING_AUTH_API_ORIGIN"),
            webOrigin: required("STAGING_AUTH_WEB_ORIGIN"),
          });

          if (!idPattern.test(accountId) || !idPattern.test(hyperdriveId)) {
            throw new Error("Refusing an invalid Cloudflare account or Hyperdrive ID.");
          }
          if (configuredStagingWorkerName !== expectedStagingWorkerName) {
            throw new Error("STAGING_API_SERVICE_NAME must be dayli-api-staging.");
          }
          if (!hyperdriveNamePattern.test(expectedHyperdriveName)) {
            throw new Error("Refusing an invalid expected Hyperdrive name.");
          }

          const isPullRequest = process.env.EVENT_NAME === "pull_request";
          const prNumber = process.env.PR_NUMBER;
          if (isPullRequest && !/^[1-9][0-9]*$/.test(prNumber ?? "")) {
            throw new Error("Refusing an invalid pull request number.");
          }

          const previewWorkerName = isPullRequest ? `dayli-api-pr-${prNumber}` : undefined;
          if (previewWorkerName) assertWorkerName(previewWorkerName);
          assertWorkerName(expectedStagingWorkerName);

          const response = await fetch(
            `https://api.cloudflare.com/client/v4/accounts/${accountId}/hyperdrive/configs/${hyperdriveId}`,
            { headers: { Authorization: `Bearer ${apiToken}` } },
          );
          if (!response.ok) {
            throw new Error(`Could not read the configured staging Hyperdrive (HTTP ${response.status}).`);
          }
          const payload = await response.json();
          if (payload?.result?.name !== expectedHyperdriveName) {
            throw new Error("CLOUDFLARE_STAGING_HYPERDRIVE_ID is not the expected staging Hyperdrive.");
          }
          if (payload?.result?.caching?.disabled !== true) {
            throw new Error("The staging Hyperdrive must have caching disabled.");
          }

          const shared = {
            $schema: "node_modules/wrangler/config-schema.json",
            main: "src/index.ts",
            compatibility_date: "2026-03-10",
            compatibility_flags: ["nodejs_compat"],
          };
          const apiConfig = {
            ...shared,
            name: previewWorkerName ?? expectedStagingWorkerName,
            // dayli-api-staging is public for staging web and mobile clients.
            workers_dev: !isPullRequest,
            observability: { enabled: true },
            // Public origin bindings are validated above. Secrets stay in the Worker secret store.
            vars: {
              BETTER_AUTH_BASE_URL: authApiOrigin,
              BETTER_AUTH_TRUSTED_ORIGINS: `${authApiOrigin},${authWebOrigin}`,
            },
            hyperdrive: [{ binding: "HYPERDRIVE", id: hyperdriveId }],
          };
          const testConfig = {
            ...shared,
            name: isPullRequest
              ? `dayli-api-hyperdrive-test-pr-${prNumber}`
              : "dayli-api-hyperdrive-integration-test",
            // The remote-binding test proxy must not receive a public workers.dev URL.
            workers_dev: false,
            services: [{
              binding: "STAGING_API",
              service: apiConfig.name,
              entrypoint: "HyperdriveIntegrationEntrypoint",
              remote: true,
            }],
          };

          writeFileSync(
            isPullRequest
              ? "apps/api/wrangler.preview.jsonc"
              : "apps/api/wrangler.staging.jsonc",
            `${JSON.stringify(apiConfig, null, 2)}\n`,
          );
          writeFileSync(
            "apps/api/wrangler.hyperdrive-test.jsonc",
            `${JSON.stringify(testConfig, null, 2)}\n`,
          );
          NODE
      - name: Deploy the isolated PR API Worker
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --dir apps/api exec wrangler deploy --config wrangler.preview.jsonc
      - name: Deploy the public staging API Worker
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --dir apps/api exec wrangler deploy --config wrangler.staging.jsonc
      - name: Run the Workers Hyperdrive check
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @dayli/api test:hyperdrive:staging
      - name: Upload sanitized Hyperdrive evidence
        if: ${{ always() && needs.changes.outputs.relevant == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: hyperdrive-proof-${{ github.sha }}
          path: apps/api/hyperdrive-proof-evidence.json
          retention-days: 90
          if-no-files-found: warn
      - name: Delete the isolated PR API Worker
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const apiToken = process.env.CLOUDFLARE_API_TOKEN;
          const prNumber = process.env.PR_NUMBER;

          if (!/^[a-f0-9]{32}$/.test(accountId ?? "")) {
            throw new Error("Refusing an invalid Cloudflare account ID.");
          }
          if (!apiToken) throw new Error("CLOUDFLARE_API_TOKEN is required.");
          if (!/^[1-9][0-9]*$/.test(prNumber ?? "")) {
            throw new Error("Refusing an invalid pull request number.");
          }

          const workerName = `dayli-api-pr-${prNumber}`;
          if (!/^dayli-api-pr-[1-9][0-9]*$/.test(workerName)) {
            throw new Error("Refusing an invalid preview Worker name.");
          }

          async function request(path, method) {
            const response = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${accountId}${path}`,
              { method, headers: { Authorization: `Bearer ${apiToken}` } },
            );
            if (response.status === 204) return { response, payload: { success: true } };
            let payload;
            try {
              payload = await response.json();
            } catch {
              throw new Error(`Cloudflare ${method} ${path} returned invalid JSON (HTTP ${response.status}).`);
            }
            return { response, payload };
          }

          function requireSuccess({ response, payload }, path, method) {
            if (!response.ok || payload?.success !== true) {
              throw new Error(`Cloudflare ${method} ${path} failed (HTTP ${response.status}).`);
            }
            return payload;
          }

          async function listScripts() {
            const payload = requireSuccess(
              await request("/workers/scripts", "GET"),
              "/workers/scripts",
              "GET",
            );
            if (!Array.isArray(payload.result)) {
              throw new Error("Cloudflare returned an invalid Worker list.");
            }
            return payload.result;
          }

          const scripts = await listScripts();
          if (!scripts.some((script) => script?.id === workerName)) {
            console.log(`Preview Worker ${workerName} is already absent.`);
          } else {
            const deletion = await request(`/workers/scripts/${workerName}`, "DELETE");
            if (!deletion.response.ok || deletion.payload?.success !== true) {
              if (deletion.response.status === 404) {
                const remainingScripts = await listScripts();
                if (!remainingScripts.some((script) => script?.id === workerName)) {
                  console.log(`Preview Worker ${workerName} was removed by a concurrent cleanup.`);
                  process.exit(0);
                }
              }
              requireSuccess(deletion, `/workers/scripts/${workerName}`, "DELETE");
            }
            console.log(`Deleted preview Worker ${workerName}.`);
          }
          NODE

  gate:
    if: always()
    needs: [changes, check]
    runs-on: ubuntu-latest
    steps:
      - name: Required staging proof gate
        if: needs.changes.outputs.relevant != 'true' || needs.check.result == 'success' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)
        run: echo "Staging proof gate passed or was not required."
      - name: Reject a failed relevant staging proof
        if: needs.changes.outputs.relevant == 'true' && needs.check.result != 'success' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)
        run: exit 1
