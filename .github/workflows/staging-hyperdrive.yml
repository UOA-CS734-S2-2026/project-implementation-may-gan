name: Deploy staging API and Hyperdrive proof

# Called only by staging-release.yml. Do not add independent dispatch or CI
# triggers because API and web must use the same captured mode and commit.
on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      migration_mode:
        required: true
        type: string
      browser_proxy_enabled:
        required: true
        type: string
      tooling_sha:
        required: true
        type: string
      push_readiness:
        required: true
        type: string
      export_approval:
        required: true
        type: string
      export_cleanup_only:
        required: true
        type: string

permissions:
  contents: read

# Shares the staging database-state lock with the manual migration workflow.
# The caller has a separate release lock, so this does not recurse through a
# reusable workflow or serialize production.
concurrency:
  group: staging-database-state-staging
  cancel-in-progress: false

jobs:
  deploy:
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - name: Validate captured release mode and browser proxy mode
        env:
          CAPTURED_MIGRATION_MODE: ${{ inputs.migration_mode }}
          CAPTURED_BROWSER_PROXY_ENABLED: ${{ inputs.browser_proxy_enabled }}
          CAPTURED_PUSH_READINESS: ${{ inputs.push_readiness }}
          CAPTURED_EXPORT_APPROVAL: ${{ inputs.export_approval }}
          CAPTURED_EXPORT_CLEANUP_ONLY: ${{ inputs.export_cleanup_only }}
          STAGING_BROWSER_PROXY_ENABLED: ${{ vars.STAGING_BROWSER_PROXY_ENABLED || 'false' }}
        run: |
          if [[ "$CAPTURED_MIGRATION_MODE" != "forward" && "$CAPTURED_MIGRATION_MODE" != "rollback-verify-only" ]]; then
            echo 'Captured migration mode is invalid.' >&2
            exit 1
          fi
          if [[ "$CAPTURED_BROWSER_PROXY_ENABLED" != "true" && "$CAPTURED_BROWSER_PROXY_ENABLED" != "false" ]]; then
            echo 'Captured browser proxy mode must be true or false.' >&2
            exit 1
          fi
          if [[ "$CAPTURED_BROWSER_PROXY_ENABLED" != "$STAGING_BROWSER_PROXY_ENABLED" ]]; then
            echo 'Captured browser proxy mode no longer matches staging.' >&2
            exit 1
          fi
          if [[ "$CAPTURED_PUSH_READINESS" != "true" && "$CAPTURED_PUSH_READINESS" != "false" ]]; then
            echo 'Captured push readiness mode must be true or false.' >&2
            exit 1
          fi
          if [[ ( "$CAPTURED_EXPORT_APPROVAL" != 'none' && "$CAPTURED_EXPORT_APPROVAL" != 'all-staging-accounts' ) ||
                ( "$CAPTURED_EXPORT_CLEANUP_ONLY" != 'none' && "$CAPTURED_EXPORT_CLEANUP_ONLY" != 'continue-existing-cleanup' ) ]]; then
            echo 'Captured export mode is invalid.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Check out immutable release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tooling_sha }}
          path: deployment-tooling
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: deployment-tooling
      - name: Verify direct migrator target matches configured Hyperdrive
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_STAGING_HYPERDRIVE_ID: ${{ secrets.CLOUDFLARE_STAGING_HYPERDRIVE_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node deployment-tooling/scripts/verify-staging-schema-target.mjs
      - name: Check captured release migrations before mutation
        if: inputs.migration_mode == 'forward'
        env:
          MIGRATION_BASE_REF: ${{ format('{0}~1', inputs.commit_sha) }}
          MIGRATION_REPOSITORY_ROOT: ${{ github.workspace }}
          MIGRATIONS_DIR: ${{ github.workspace }}/packages/db/migrations
        run: pnpm --dir deployment-tooling db:check
      - name: Plan pending reviewed migrations
        id: migration_plan
        if: inputs.migration_mode == 'forward'
        env:
          MIGRATION_TARGET: staging
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATION_REPOSITORY_ROOT: ${{ github.workspace }}
          MIGRATIONS_DIR: ${{ github.workspace }}/packages/db/migrations
        run: pnpm --dir deployment-tooling db:plan
      - name: Preflight pending messaging FK detachment migration size
        if: inputs.migration_mode == 'forward'
        env:
          MIGRATION_TARGET: staging
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATIONS_DIR: ${{ github.workspace }}/packages/db/migrations
        run: node deployment-tooling/scripts/staging-messaging-0024-preflight.mjs
      - name: Apply pending reviewed migrations
        if: inputs.migration_mode == 'forward' && steps.migration_plan.outputs.pending == 'true'
        env:
          MIGRATION_TARGET: staging
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATIONS_DIR: ${{ github.workspace }}/packages/db/migrations
        run: pnpm --dir deployment-tooling db:migrate
      - name: Verify the captured release schema before deployment
        env:
          MIGRATION_TARGET: staging
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATIONS_DIR: ${{ github.workspace }}/packages/db/migrations
        run: pnpm --dir deployment-tooling db:verify
      - name: Validate staging resource and generate configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_STAGING_HYPERDRIVE_ID: ${{ secrets.CLOUDFLARE_STAGING_HYPERDRIVE_ID }}
          STAGING_API_SERVICE_NAME: ${{ vars.STAGING_API_SERVICE_NAME }}
          STAGING_HYPERDRIVE_NAME: ${{ vars.STAGING_HYPERDRIVE_NAME }}
          STAGING_AUTH_API_ORIGIN: ${{ vars.STAGING_AUTH_API_ORIGIN }}
          STAGING_AUTH_WEB_ORIGIN: ${{ vars.STAGING_AUTH_WEB_ORIGIN }}
          STAGING_AUTH_SITE_HOST: ${{ vars.STAGING_AUTH_SITE_HOST }}
          STAGING_BROWSER_PROXY_ENABLED: ${{ inputs.browser_proxy_enabled }}
          STAGING_NOTIFICATION_PUBLISHERS_ENABLED: ${{ vars.STAGING_NOTIFICATION_PUBLISHERS_ENABLED || 'false' }}
          STAGING_NOTIFICATION_DELIVERY_ENABLED: ${{ vars.STAGING_NOTIFICATION_DELIVERY_ENABLED || 'false' }}
          STAGING_GOOGLE_WEB_CLIENT_ID: ${{ vars.STAGING_GOOGLE_WEB_CLIENT_ID }}
          STAGING_GOOGLE_IOS_CLIENT_ID: ${{ vars.STAGING_GOOGLE_IOS_CLIENT_ID }}
          STAGING_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.STAGING_GOOGLE_ANDROID_CLIENT_ID }}
          STAGING_RESEND_FROM: ${{ vars.STAGING_RESEND_FROM }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          STAGING_R2_BUCKET_NAME: ${{ vars.STAGING_R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STAGING_RELEASE_SHA: ${{ inputs.commit_sha }}
          CLOUDFLARE_STAGING_EXPORT_WORKER_HYPERDRIVE_ID: ${{ secrets.CLOUDFLARE_STAGING_EXPORT_WORKER_HYPERDRIVE_ID }}
          STAGING_EXPORT_ALL_USERS_APPROVED: ${{ inputs.export_approval == 'all-staging-accounts' && inputs.export_approval || '' }}
          STAGING_EXPORT_CLEANUP_ONLY_APPROVED: ${{ inputs.export_cleanup_only == 'continue-existing-cleanup' && inputs.export_cleanup_only || '' }}
          STAGING_EXPORT_PROOF_APPROVED: ${{ vars.STAGING_EXPORT_PROOF_APPROVED }}
          STAGING_EXPORT_PROOF_USER_ID: ${{ vars.STAGING_EXPORT_PROOF_USER_ID }}
          STAGING_EXPORT_PROOF_BUILD_UNTIL: ${{ vars.STAGING_EXPORT_PROOF_BUILD_UNTIL }}
          STAGING_EXPORT_PROOF_CLEANUP_REVIEW_AFTER: ${{ vars.STAGING_EXPORT_PROOF_CLEANUP_REVIEW_AFTER }}
        run: node scripts/run-staging-api-deploy.mjs
      - name: Dry-run generated Worker configurations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm --dir apps/api exec wrangler deploy --dry-run --config wrangler.staging.jsonc
          pnpm --dir apps/api exec wrangler deploy --dry-run --config wrangler.hyperdrive-test.jsonc
      - name: Run OAuth-only push readiness
        if: inputs.push_readiness == 'true'
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          CANDIDATE_COMMIT_SHA: ${{ inputs.commit_sha }}
          PUSH_READINESS_ARTIFACT_PATH: ${{ runner.temp }}/push-readiness/push-readiness.json
        run: pnpm --dir deployment-tooling exec tsx scripts/staging-push-readiness.ts
      - name: Upload sanitized push readiness artifact
        if: ${{ always() && inputs.push_readiness == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: push-readiness-${{ inputs.commit_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/push-readiness/push-readiness.json
          retention-days: 90
          if-no-files-found: error
      - name: Synchronize reviewed Worker secrets after configuration dry-runs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_STAGING_HYPERDRIVE_ID: ${{ secrets.CLOUDFLARE_STAGING_HYPERDRIVE_ID }}
          STAGING_API_SERVICE_NAME: ${{ vars.STAGING_API_SERVICE_NAME }}
          STAGING_HYPERDRIVE_NAME: ${{ vars.STAGING_HYPERDRIVE_NAME }}
          STAGING_AUTH_API_ORIGIN: ${{ vars.STAGING_AUTH_API_ORIGIN }}
          STAGING_AUTH_WEB_ORIGIN: ${{ vars.STAGING_AUTH_WEB_ORIGIN }}
          STAGING_AUTH_SITE_HOST: ${{ vars.STAGING_AUTH_SITE_HOST }}
          STAGING_GOOGLE_WEB_CLIENT_ID: ${{ vars.STAGING_GOOGLE_WEB_CLIENT_ID }}
          STAGING_GOOGLE_IOS_CLIENT_ID: ${{ vars.STAGING_GOOGLE_IOS_CLIENT_ID }}
          STAGING_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.STAGING_GOOGLE_ANDROID_CLIENT_ID }}
          STAGING_RESEND_FROM: ${{ vars.STAGING_RESEND_FROM }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          STAGING_R2_BUCKET_NAME: ${{ vars.STAGING_R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/sync-staging-api-secrets.mjs
      - name: Deploy the reviewed staging API Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          pnpm --dir apps/api exec wrangler deploy --config wrangler.staging.jsonc
          --tag "${{ inputs.commit_sha }}" --message "staging-release:${{ inputs.commit_sha }}"
      - name: Run the Workers Hyperdrive check
        id: proof
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @dayli/api test:hyperdrive:staging
      - name: Write sanitized Hyperdrive evidence
        env:
          PROOF_STEP_OUTCOME: ${{ steps.proof.outcome }}
          DEPLOYED_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          if (process.env.PROOF_STEP_OUTCOME !== 'success') throw new Error('Refusing evidence without a successful private Worker proof.');
          if (!/^[a-f0-9]{40}$/.test(process.env.DEPLOYED_COMMIT_SHA ?? '')) throw new Error('Refusing evidence without a valid deployed commit SHA.');
          const api = JSON.parse(readFileSync('apps/api/package.json', 'utf8'));
          const root = JSON.parse(readFileSync('package.json', 'utf8'));
          writeFileSync('apps/api/hyperdrive-proof-evidence.json', JSON.stringify({
            commitSha: process.env.DEPLOYED_COMMIT_SHA,
            target: 'staging', timestamp: new Date().toISOString(), pass: true,
            checks: ['select_1_through_hyperdrive', 'transaction_commit_and_rollback', 'constraint_classes_and_role_permissions', 'fresh_invocation_visibility_and_cleanup'],
            versions: { node: process.version, pnpm: root.packageManager, wrangler: api.devDependencies.wrangler, workersVitestPlugin: api.devDependencies['@cloudflare/vitest-plugin'], vitest: api.devDependencies.vitest, compatibilityDate: '2026-03-10' },
          }, null, 2));
          NODE
      - name: Upload sanitized Hyperdrive evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hyperdrive-proof-${{ inputs.commit_sha }}-${{ github.run_attempt }}
          path: apps/api/hyperdrive-proof-evidence.json
          retention-days: 90
          if-no-files-found: warn
