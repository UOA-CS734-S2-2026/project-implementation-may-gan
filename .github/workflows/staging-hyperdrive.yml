name: Deploy staging API and Hyperdrive proof

# Manual only. GitHub Environment approval is the owner gate for this workflow.
# Do not add push, pull_request, or pull_request_target triggers.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-hyperdrive
  cancel-in-progress: false

jobs:
  require-main:
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-main dispatch
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != refs/heads/main ]]; then
            echo 'Staging deployment requires a manual dispatch from main.' >&2
            exit 1
          fi

  deploy:
    needs: require-main
    if: github.ref == 'refs/heads/main'
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate staging resource and generate configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_STAGING_HYPERDRIVE_ID: ${{ secrets.CLOUDFLARE_STAGING_HYPERDRIVE_ID }}
          STAGING_API_SERVICE_NAME: ${{ vars.STAGING_API_SERVICE_NAME }}
          STAGING_HYPERDRIVE_NAME: ${{ vars.STAGING_HYPERDRIVE_NAME }}
          STAGING_AUTH_API_ORIGIN: ${{ vars.STAGING_AUTH_API_ORIGIN }}
          STAGING_AUTH_WEB_ORIGIN: ${{ vars.STAGING_AUTH_WEB_ORIGIN }}
          STAGING_AUTH_SITE_HOST: ${{ vars.STAGING_AUTH_SITE_HOST }}
          STAGING_GOOGLE_WEB_CLIENT_ID: ${{ vars.STAGING_GOOGLE_WEB_CLIENT_ID }}
          STAGING_GOOGLE_IOS_CLIENT_ID: ${{ vars.STAGING_GOOGLE_IOS_CLIENT_ID }}
          STAGING_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.STAGING_GOOGLE_ANDROID_CLIENT_ID }}
          STAGING_RESEND_FROM: ${{ vars.STAGING_RESEND_FROM }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: node scripts/run-staging-api-deploy.mjs
      - name: Dry-run generated Worker configurations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm --dir apps/api exec wrangler deploy --dry-run --config wrangler.staging.jsonc
          pnpm --dir apps/api exec wrangler deploy --dry-run --config wrangler.hyperdrive-test.jsonc
      - name: Synchronize reviewed Worker secrets after configuration dry-runs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_STAGING_HYPERDRIVE_ID: ${{ secrets.CLOUDFLARE_STAGING_HYPERDRIVE_ID }}
          STAGING_API_SERVICE_NAME: ${{ vars.STAGING_API_SERVICE_NAME }}
          STAGING_HYPERDRIVE_NAME: ${{ vars.STAGING_HYPERDRIVE_NAME }}
          STAGING_AUTH_API_ORIGIN: ${{ vars.STAGING_AUTH_API_ORIGIN }}
          STAGING_AUTH_WEB_ORIGIN: ${{ vars.STAGING_AUTH_WEB_ORIGIN }}
          STAGING_AUTH_SITE_HOST: ${{ vars.STAGING_AUTH_SITE_HOST }}
          STAGING_GOOGLE_WEB_CLIENT_ID: ${{ vars.STAGING_GOOGLE_WEB_CLIENT_ID }}
          STAGING_GOOGLE_IOS_CLIENT_ID: ${{ vars.STAGING_GOOGLE_IOS_CLIENT_ID }}
          STAGING_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.STAGING_GOOGLE_ANDROID_CLIENT_ID }}
          STAGING_RESEND_FROM: ${{ vars.STAGING_RESEND_FROM }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          STAGING_SECRET_SYNC: "true"
        run: node scripts/run-staging-api-deploy.mjs
      - name: Deploy the reviewed staging API Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --dir apps/api exec wrangler deploy --config wrangler.staging.jsonc
      - name: Run the Workers Hyperdrive check
        id: proof
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @dayli/api test:hyperdrive:staging
      - name: Write sanitized Hyperdrive evidence
        env:
          PROOF_STEP_OUTCOME: ${{ steps.proof.outcome }}
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');
          if (process.env.PROOF_STEP_OUTCOME !== 'success') throw new Error('Refusing evidence without a successful private Worker proof.');
          if (!/^[a-f0-9]{40}$/.test(process.env.GITHUB_SHA ?? '')) throw new Error('Refusing evidence without a valid commit SHA.');
          const api = JSON.parse(readFileSync('apps/api/package.json', 'utf8'));
          const root = JSON.parse(readFileSync('package.json', 'utf8'));
          writeFileSync('apps/api/hyperdrive-proof-evidence.json', JSON.stringify({
            commitSha: process.env.GITHUB_SHA,
            target: 'staging', timestamp: new Date().toISOString(), pass: true,
            checks: ['select_1_through_hyperdrive', 'transaction_commit_and_rollback', 'constraint_classes_and_role_permissions', 'fresh_invocation_visibility_and_cleanup'],
            versions: { node: process.version, pnpm: root.packageManager, wrangler: api.devDependencies.wrangler, workersVitestPlugin: api.devDependencies['@cloudflare/vitest-plugin'], vitest: api.devDependencies.vitest, compatibilityDate: '2026-03-10' },
          }, null, 2));
          NODE
      - name: Upload sanitized Hyperdrive evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: hyperdrive-proof-${{ github.sha }}
          path: apps/api/hyperdrive-proof-evidence.json
          retention-days: 90
          if-no-files-found: warn
