name: Staging Hyperdrive integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-hyperdrive
  cancel-in-progress: false

jobs:
  check:
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write credentialed Wrangler configurations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_STAGING_HYPERDRIVE_ID: ${{ secrets.CLOUDFLARE_STAGING_HYPERDRIVE_ID }}
          STAGING_API_SERVICE_NAME: ${{ vars.STAGING_API_SERVICE_NAME }}
        run: |
          node <<'NODE'
          import { writeFileSync } from "node:fs";

          const required = [
            "CLOUDFLARE_ACCOUNT_ID",
            "CLOUDFLARE_STAGING_HYPERDRIVE_ID",
            "STAGING_API_SERVICE_NAME",
          ];

          for (const name of required) {
            if (!process.env[name]) {
              throw new Error(`The staging environment must provide ${name}.`);
            }
          }

          const shared = {
            $schema: "node_modules/wrangler/config-schema.json",
            main: "src/index.ts",
            compatibility_date: "2026-03-10",
            compatibility_flags: ["nodejs_compat"],
          };

          writeFileSync(
            "apps/api/wrangler.staging.jsonc",
            `${JSON.stringify(
              {
                ...shared,
                name: process.env.STAGING_API_SERVICE_NAME,
                observability: { enabled: true },
                hyperdrive: [
                  {
                    binding: "HYPERDRIVE",
                    id: process.env.CLOUDFLARE_STAGING_HYPERDRIVE_ID,
                  },
                ],
              },
              null,
              2,
            )}\n`,
          );

          writeFileSync(
            "apps/api/wrangler.hyperdrive-test.jsonc",
            `${JSON.stringify(
              {
                ...shared,
                name: "dayli-api-hyperdrive-integration-test",
                services: [
                  {
                    binding: "STAGING_API",
                    service: process.env.STAGING_API_SERVICE_NAME,
                    entrypoint: "HyperdriveIntegrationEntrypoint",
                    remote: true,
                  },
                ],
              },
              null,
              2,
            )}\n`,
          );
          NODE
      - name: Deploy the staging API binding
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --dir apps/api exec wrangler deploy --config wrangler.staging.jsonc
      - name: Run the Workers Hyperdrive check
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @dayli/api test:hyperdrive:staging
