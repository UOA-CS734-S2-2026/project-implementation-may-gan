name: Publish protected staging signup activation

# This workflow publishes database legal records only after the Workers that
# serve the approved API and web content are proven to be the same main SHA.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Activate signup, or staging-only credential rollback
        required: true
        type: choice
        options: [activate, rollback]
      confirmation:
        description: Type the operation's exact confirmation phrase
        required: true
        type: string

permissions:
  actions: write
  contents: read

# This serializes current workflows that use this group. It cannot serialize a
# historical workflow rerun whose old definition did not join the group; the
# publish job therefore freezes the staging release entry points below. This
# file has only the staging target.
concurrency:
  group: staging-database-state-staging
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Require the current immutable main revision
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ ! "$checked_out_sha" =~ ^[a-f0-9]{40}$ || "$checked_out_sha" != "$DISPATCH_SHA" || "$checked_out_sha" != "$current_main_sha" ]]; then
            echo 'Signup activation requires a fresh manual dispatch from the current main commit.' >&2
            exit 1
          fi
      - name: Require protected staging activation approval and confirmation
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
          APPROVAL: ${{ vars.STAGING_SIGNUP_ACTIVATION_APPROVED }}
          API_ORIGIN: ${{ vars.STAGING_AUTH_API_ORIGIN }}
          WEB_ORIGIN: ${{ vars.STAGING_AUTH_WEB_ORIGIN }}
        run: |
          if [[ "$APPROVAL" != 'all-staging-accounts' || "$API_ORIGIN" != 'https://api.staging.dayli.agroupforcoders.com' || "$WEB_ORIGIN" != 'https://staging.dayli.agroupforcoders.com' ]]; then
            echo 'Protected staging signup activation is unavailable.' >&2
            exit 1
          fi
          if [[ "$OPERATION" == 'activate' && "$CONFIRMATION" == 'ACTIVATE STAGING SIGNUP' ]]; then exit 0; fi
          if [[ "$OPERATION" == 'rollback' && "$CONFIRMATION" == 'ROLLBACK STAGING SIGNUP' ]]; then exit 0; fi
          echo 'The operation confirmation does not match.' >&2
          exit 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check approved legal source before database access
        run: pnpm legal:release:check
      - name: Verify direct migrator target matches configured staging Hyperdrive
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_STAGING_HYPERDRIVE_ID: ${{ secrets.CLOUDFLARE_STAGING_HYPERDRIVE_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/verify-staging-schema-target.mjs
      - name: Verify actual deployed API and web immutable revisions
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
        run: node scripts/verify-staging-deployed-shas.mjs
      - name: Freeze staging release entry points and drain historical reruns
        # A rerun uses the workflow definition from its historical commit, so
        # its concurrency group may not be this workflow's group. Freeze new
        # release entry points, cancel only runs that have not started, then
        # let started work finish. A timeout leaves releases frozen and fails
        # closed for operator recovery.
        uses: actions/github-script@v7
        with:
          script: |
            const { freezeStagingReleaseEntryPoints } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/freeze-staging-release-entry-points.mjs`);
            const { owner, repo } = context.repo;
            await freezeStagingReleaseEntryPoints({ github, owner, repo });
      # Keep this final active-version check adjacent to the mutation. It runs
      # only after the historical deployment paths are frozen above.
      - name: Recheck current main and deployed Worker revisions immediately before mutation
        env:
          DISPATCH_SHA: ${{ github.sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
        run: |
          current_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ ! "$current_main_sha" =~ ^[a-f0-9]{40}$ || "$current_main_sha" != "$DISPATCH_SHA" ]]; then
            echo 'Signup activation requires current main immediately before mutation.' >&2
            exit 1
          fi
          node scripts/verify-staging-deployed-shas.mjs
      - name: Publish legal activation with existing-account acceptance checks
        env:
          STAGING_SIGNUP_ACTIVATION_TARGET: staging
          STAGING_SIGNUP_ACTIVATION_OPERATION: ${{ inputs.operation }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/staging-signup-activation.mjs
