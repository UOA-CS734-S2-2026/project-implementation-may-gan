name: Deploy staging web

# Called only by staging-release.yml after its API proof succeeds. Do not add
# independent triggers because API and web must use one captured release mode.
on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
      browser_proxy_enabled:
        required: true
        type: string
      tooling_sha:
        required: true
        type: string
      export_approval:
        required: true
        type: string
      export_cleanup_only:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-web
  cancel-in-progress: false

jobs:
  deploy:
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - name: Validate captured browser proxy and export modes
        env:
          CAPTURED_BROWSER_PROXY_ENABLED: ${{ inputs.browser_proxy_enabled }}
          STAGING_BROWSER_PROXY_ENABLED: ${{ vars.STAGING_BROWSER_PROXY_ENABLED || 'false' }}
          CAPTURED_EXPORT_APPROVAL: ${{ inputs.export_approval }}
          CAPTURED_EXPORT_CLEANUP_ONLY: ${{ inputs.export_cleanup_only }}
        run: |
          if [[ "$CAPTURED_BROWSER_PROXY_ENABLED" != "true" && "$CAPTURED_BROWSER_PROXY_ENABLED" != "false" ]]; then
            echo 'Captured browser proxy mode must be true or false.' >&2
            exit 1
          fi
          if [[ "$CAPTURED_BROWSER_PROXY_ENABLED" != "$STAGING_BROWSER_PROXY_ENABLED" ]]; then
            echo 'Captured browser proxy mode no longer matches staging.' >&2
            exit 1
          fi
          if [[ ( "$CAPTURED_EXPORT_APPROVAL" != 'none' && "$CAPTURED_EXPORT_APPROVAL" != 'all-staging-accounts' ) ||
                ( "$CAPTURED_EXPORT_CLEANUP_ONLY" != 'none' && "$CAPTURED_EXPORT_CLEANUP_ONLY" != 'continue-existing-cleanup' ) ]]; then
            echo 'Captured export mode is invalid.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Check out immutable release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tooling_sha }}
          path: deployment-tooling
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate staging web target and origins
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_AUTH_SITE_HOST: ${{ vars.STAGING_AUTH_SITE_HOST }}
          STAGING_AUTH_API_ORIGIN: ${{ vars.STAGING_AUTH_API_ORIGIN }}
          STAGING_AUTH_WEB_ORIGIN: ${{ vars.STAGING_AUTH_WEB_ORIGIN }}
          STAGING_BROWSER_PROXY_ENABLED: ${{ inputs.browser_proxy_enabled }}
        run: |
          node <<'NODE'
          import { readFileSync } from 'node:fs';
          import { validateStagingOrigins } from './scripts/staging-origins.mjs';

          const required = (name) => {
            const value = process.env[name];
            if (!value) throw new Error(`The staging environment must provide ${name}.`);
            return value;
          };
          if (!/^[a-f0-9]{32}$/.test(required('CLOUDFLARE_ACCOUNT_ID'))) {
            throw new Error('Refusing an invalid Cloudflare account ID.');
          }
          validateStagingOrigins({
            siteHost: required('STAGING_AUTH_SITE_HOST'),
            apiOrigin: required('STAGING_AUTH_API_ORIGIN'),
            webOrigin: required('STAGING_AUTH_WEB_ORIGIN'),
          });
          if (!['true', 'false'].includes(required('STAGING_BROWSER_PROXY_ENABLED'))) {
            throw new Error('STAGING_BROWSER_PROXY_ENABLED must be true or false.');
          }
          const config = JSON.parse(readFileSync('apps/web/wrangler.jsonc', 'utf8'));
          if (config.name !== 'dayli-web-staging' || config.workers_dev !== false
            || config.main !== 'vinext/server/fetch-handler'
            || config.routes || config.route || config.account_id || config.hyperdrive
            || config.assets?.binding !== 'ASSETS'
            || JSON.stringify(config.services) !== JSON.stringify([{
              binding: 'API_BROWSER_PROXY', service: 'dayli-api-staging', entrypoint: 'BrowserProxyEntrypoint',
            }])) {
            throw new Error('Refusing unexpected staging web Worker configuration.');
          }
          NODE
      - name: Build vinext with the staging API origin
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.STAGING_AUTH_API_ORIGIN }}
          NEXT_PUBLIC_WEB_API_PROXY_ENABLED: ${{ inputs.browser_proxy_enabled }}
          NEXT_PUBLIC_WEB_API_BASE_URL: ${{ vars.STAGING_AUTH_WEB_ORIGIN }}
          NEXT_PUBLIC_STAGING_EXPORT_APPROVED: ${{ inputs.export_approval == 'all-staging-accounts' && inputs.export_approval || '' }}
        run: pnpm --filter @dayli/web build:vinext
      - name: Add required observability to the generated historical release
        run: node deployment-tooling/scripts/ensure-staging-web-observability.mjs apps/web/dist/server/wrangler.json
      - name: Validate generated deployment target
        run: |
          node <<'NODE'
          import { readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('apps/web/dist/server/wrangler.json', 'utf8'));
          if (config.name !== 'dayli-web-staging' || config.workers_dev !== false
            || config.observability?.enabled !== true
            || config.observability?.logs?.enabled !== true
            || config.observability?.logs?.invocation_logs !== true
            || config.routes?.length || config.route || config.hyperdrive?.length
            || config.assets?.binding !== 'ASSETS'
            || JSON.stringify(config.services) !== JSON.stringify([{
              binding: 'API_BROWSER_PROXY', service: 'dayli-api-staging', entrypoint: 'BrowserProxyEntrypoint',
            }])) {
            throw new Error('Refusing an unexpected generated web Worker target or binding.');
          }
          NODE
      - name: Deploy staging web Worker without a public workers.dev route
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo 'The staging environment must provide CLOUDFLARE_API_TOKEN.' >&2
            exit 1
          fi
          pnpm --dir apps/web exec wrangler deploy --config dist/server/wrangler.json
