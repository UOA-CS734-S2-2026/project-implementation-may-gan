name: Clean up closed Hyperdrive preview

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Closed same-repository PR number whose preview Worker should be deleted
        required: true
        type: string

permissions:
  pull-requests: read

# Serialize cleanup attempts for one requested preview without adding an
# automatic pull request trigger.
concurrency:
  group: cleanup-hyperdrive-preview-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  hosted-mutation-authorization:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.authorization.outputs.authorized }}
      target_sha: ${{ steps.authorization.outputs.target_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - id: authorization
        name: Check the live operational hold
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          TARGET_SHA="$(node scripts/check-hosted-mutation-authorization.mjs --expected-sha "$EXPECTED_SHA")"
          echo 'authorized=true' >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

  cleanup:
    # Only the workflow file on main may use the protected staging environment.
    # Do not use pull_request_target or check out or execute PR code.
    needs: hosted-mutation-authorization
    if: github.ref == 'refs/heads/main' && needs.hosted-mutation-authorization.outputs.authorized == 'true'
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - name: Verify the closed PR and cleanup target
        id: pr
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const prNumber = process.env.PR_NUMBER;
            if (!/^[1-9][0-9]*$/.test(prNumber ?? "")) {
              throw new Error("Refusing an invalid pull request number.");
            }
            const pullNumber = Number(prNumber);
            if (!Number.isSafeInteger(pullNumber)) {
              throw new Error("Refusing an unsafe pull request number.");
            }

            const { owner, repo } = context.repo;
            const repository = `${owner}/${repo}`;
            const { data: pull } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });
            if (
              pull.state !== "closed" ||
              pull.base.ref !== "main" ||
              pull.base.repo?.full_name !== repository ||
              pull.head.repo?.full_name !== repository ||
              pull.head.repo?.fork !== false
            ) {
              throw new Error("Refusing a PR that is not a closed, main-based, same-repository non-fork PR.");
            }

            core.setOutput("pr_number", prNumber);
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Delete the verified PR preview Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          node <<'NODE'
          (async () => {
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const apiToken = process.env.CLOUDFLARE_API_TOKEN;
          const prNumber = process.env.PR_NUMBER;

          if (!/^[a-f0-9]{32}$/.test(accountId ?? "")) {
            throw new Error("Refusing an invalid Cloudflare account ID.");
          }
          if (!apiToken) throw new Error("CLOUDFLARE_API_TOKEN is required.");
          if (!/^[1-9][0-9]*$/.test(prNumber ?? "")) {
            throw new Error("Refusing an invalid pull request number.");
          }

          const workerName = `dayli-api-pr-${prNumber}`;
          if (!/^dayli-api-pr-[1-9][0-9]*$/.test(workerName)) {
            throw new Error("Refusing an invalid preview Worker name.");
          }

          async function request(path, method) {
            const response = await fetch(
              `https://api.cloudflare.com/client/v4/accounts/${accountId}${path}`,
              { method, headers: { Authorization: `Bearer ${apiToken}` } },
            );
            if (response.status === 204) return { response, payload: { success: true } };
            let payload;
            try {
              payload = await response.json();
            } catch {
              throw new Error(`Cloudflare ${method} ${path} returned invalid JSON (HTTP ${response.status}).`);
            }
            return { response, payload };
          }

          function requireSuccess({ response, payload }, path, method) {
            if (!response.ok || payload?.success !== true) {
              throw new Error(`Cloudflare ${method} ${path} failed (HTTP ${response.status}).`);
            }
            return payload;
          }

          async function listScripts() {
            const payload = requireSuccess(
              await request("/workers/scripts", "GET"),
              "/workers/scripts",
              "GET",
            );
            if (!Array.isArray(payload.result)) {
              throw new Error("Cloudflare returned an invalid Worker list.");
            }
            return payload.result;
          }

          const scripts = await listScripts();
          if (!scripts.some((script) => script?.id === workerName)) {
            console.log(`Preview Worker ${workerName} is already absent.`);
          } else {
            const deletion = await request(`/workers/scripts/${workerName}`, "DELETE");
            if (!deletion.response.ok || deletion.payload?.success !== true) {
              if (deletion.response.status === 404) {
                const remainingScripts = await listScripts();
                if (!remainingScripts.some((script) => script?.id === workerName)) {
                  console.log(`Preview Worker ${workerName} was removed by a concurrent cleanup.`);
                  process.exit(0);
                }
              }
              requireSuccess(deletion, `/workers/scripts/${workerName}`, "DELETE");
            }
            console.log(`Deleted closed-PR preview Worker ${workerName}.`);
          }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
