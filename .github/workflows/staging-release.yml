name: Deploy coordinated staging release

# This is the only staging deployment entry point. It captures the reviewed mode
# once, deploys and proves API first, then builds and deploys web at the same SHA.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Optional reviewed main commit SHA, staging schema must exactly match it
        required: false
        type: string
      push_readiness:
        description: Run OAuth-only push readiness before secret synchronization
        required: false
        default: false
        type: boolean
      post_trash_approved_marker_digest:
        description: One explicitly approved synthetic Trash marker digest, empty allows no eligible posts
        required: false
        default: ""
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: staging-release
  cancel-in-progress: false

jobs:
  capture:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    environment: staging
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      migration_mode: ${{ steps.release.outputs.migration_mode }}
      browser_proxy_enabled: ${{ steps.release.outputs.browser_proxy_enabled }}
      tooling_sha: ${{ steps.release.outputs.tooling_sha }}
      push_readiness: ${{ steps.release.outputs.push_readiness }}
      post_trash_approval_digest: ${{ steps.release.outputs.post_trash_approval_digest }}
      export_approval: ${{ steps.release.outputs.export_approval }}
      export_cleanup_only: ${{ steps.release.outputs.export_cleanup_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: release
        env:
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.commit_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          TOOLING_SHA: ${{ github.workflow_sha }}
          STAGING_BROWSER_PROXY_ENABLED: ${{ vars.STAGING_BROWSER_PROXY_ENABLED || 'false' }}
          PUSH_READINESS: ${{ github.event_name == 'workflow_dispatch' && inputs.push_readiness || 'false' }}
          STAGING_POST_TRASH_APPROVED_MARKER_DIGEST: ${{ github.event_name == 'workflow_dispatch' && inputs.post_trash_approved_marker_digest || '' }}
          STAGING_EXPORT_ALL_USERS_APPROVED: ${{ vars.STAGING_EXPORT_ALL_USERS_APPROVED }}
          STAGING_EXPORT_CLEANUP_ONLY_APPROVED: ${{ vars.STAGING_EXPORT_CLEANUP_ONLY_APPROVED }}
        run: node scripts/capture-staging-release.mjs
      - name: Capture non-sensitive deployed release attribution
        env:
          RELEASE_SHA: ${{ steps.release.outputs.commit_sha }}
          AUTOMATION_SHA: ${{ steps.release.outputs.tooling_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/staging-release-attribution"
          printf 'release_sha=%s\nautomation_sha=%s\n' "$RELEASE_SHA" "$AUTOMATION_SHA" > "$RUNNER_TEMP/staging-release-attribution/staging-release-attribution.txt"
      - name: Upload staged release attribution
        uses: actions/upload-artifact@v4
        with:
          name: staging-release-attribution
          path: ${{ runner.temp }}/staging-release-attribution/staging-release-attribution.txt
          if-no-files-found: error
          retention-days: 1

  api:
    needs: capture
    uses: ./.github/workflows/staging-hyperdrive.yml
    with:
      commit_sha: ${{ needs.capture.outputs.commit_sha }}
      migration_mode: ${{ needs.capture.outputs.migration_mode }}
      browser_proxy_enabled: ${{ needs.capture.outputs.browser_proxy_enabled }}
      tooling_sha: ${{ needs.capture.outputs.tooling_sha }}
      push_readiness: ${{ needs.capture.outputs.push_readiness }}
      post_trash_approval_digest: ${{ needs.capture.outputs.post_trash_approval_digest }}
      export_approval: ${{ needs.capture.outputs.export_approval }}
      export_cleanup_only: ${{ needs.capture.outputs.export_cleanup_only }}
    secrets: inherit

  web:
    needs: [capture, api]
    uses: ./.github/workflows/staging-web.yml
    with:
      commit_sha: ${{ needs.capture.outputs.commit_sha }}
      browser_proxy_enabled: ${{ needs.capture.outputs.browser_proxy_enabled }}
      tooling_sha: ${{ needs.capture.outputs.tooling_sha }}
      export_approval: ${{ needs.capture.outputs.export_approval }}
      export_cleanup_only: ${{ needs.capture.outputs.export_cleanup_only }}
    secrets: inherit
