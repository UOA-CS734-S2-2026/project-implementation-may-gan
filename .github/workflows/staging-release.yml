name: Deploy coordinated staging release

# This is the only staging deployment entry point. It captures the reviewed mode
# once, deploys and proves API first, then builds and deploys web at the same SHA.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Optional reviewed main commit SHA for a compatible rollback
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: staging-release
  cancel-in-progress: false

jobs:
  capture:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    environment: staging
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      browser_proxy_enabled: ${{ steps.release.outputs.browser_proxy_enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: release
        env:
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.commit_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          STAGING_BROWSER_PROXY_ENABLED: ${{ vars.STAGING_BROWSER_PROXY_ENABLED || 'false' }}
        run: node scripts/capture-staging-release.mjs

  api:
    needs: capture
    uses: ./.github/workflows/staging-hyperdrive.yml
    with:
      commit_sha: ${{ needs.capture.outputs.commit_sha }}
      browser_proxy_enabled: ${{ needs.capture.outputs.browser_proxy_enabled }}
    secrets: inherit

  web:
    needs: [capture, api]
    uses: ./.github/workflows/staging-web.yml
    with:
      commit_sha: ${{ needs.capture.outputs.commit_sha }}
      browser_proxy_enabled: ${{ needs.capture.outputs.browser_proxy_enabled }}
    secrets: inherit
