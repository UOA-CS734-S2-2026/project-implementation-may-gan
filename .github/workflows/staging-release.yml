name: Deploy coordinated staging release

# This is the only staging deployment entry point. It authorizes a reviewed main
# commit, captures the browser proxy mode once, deploys and proves API first,
# then builds and deploys web at the same SHA.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-release
  cancel-in-progress: false

jobs:
  hosted-mutation-authorization:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.authorization.outputs.authorized }}
      target_sha: ${{ steps.authorization.outputs.target_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
      - id: authorization
        name: Check the live operational hold
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          TARGET_SHA="$(node scripts/check-hosted-mutation-authorization.mjs --expected-sha "$EXPECTED_SHA")"
          echo 'authorized=true' >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

  capture:
    needs: hosted-mutation-authorization
    if: needs.hosted-mutation-authorization.outputs.authorized == 'true'
    environment: staging
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      browser_proxy_enabled: ${{ steps.release.outputs.browser_proxy_enabled }}
    steps:
      - id: release
        env:
          AUTHORIZED_COMMIT_SHA: ${{ needs.hosted-mutation-authorization.outputs.target_sha }}
          STAGING_BROWSER_PROXY_ENABLED: ${{ vars.STAGING_BROWSER_PROXY_ENABLED || 'false' }}
        run: |
          set -Eeuo pipefail
          if [[ ! "$AUTHORIZED_COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'Refusing release without an authorized commit SHA.' >&2
            exit 1
          fi
          if [[ "$STAGING_BROWSER_PROXY_ENABLED" != "true" && "$STAGING_BROWSER_PROXY_ENABLED" != "false" ]]; then
            echo 'STAGING_BROWSER_PROXY_ENABLED must be true or false.' >&2
            exit 1
          fi
          printf 'commit_sha=%s\n' "$AUTHORIZED_COMMIT_SHA" >> "$GITHUB_OUTPUT"
          printf 'browser_proxy_enabled=%s\n' "$STAGING_BROWSER_PROXY_ENABLED" >> "$GITHUB_OUTPUT"

  api:
    needs: capture
    uses: ./.github/workflows/staging-hyperdrive.yml
    with:
      commit_sha: ${{ needs.capture.outputs.commit_sha }}
      browser_proxy_enabled: ${{ needs.capture.outputs.browser_proxy_enabled }}
    secrets: inherit

  web:
    needs: [capture, api]
    uses: ./.github/workflows/staging-web.yml
    with:
      commit_sha: ${{ needs.capture.outputs.commit_sha }}
      browser_proxy_enabled: ${{ needs.capture.outputs.browser_proxy_enabled }}
    secrets: inherit
