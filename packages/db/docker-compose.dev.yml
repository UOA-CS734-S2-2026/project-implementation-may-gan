services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: dayli_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm db:dev:up to create the local development credentials.}
      MIGRATOR_DATABASE_PASSWORD: ${MIGRATOR_DATABASE_PASSWORD:?Run pnpm db:dev:up to create the local development credentials.}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Run pnpm db:dev:up to create the local development credentials.}
      LIFECYCLE_WORKER_DATABASE_PASSWORD: ${LIFECYCLE_WORKER_DATABASE_PASSWORD:?Run pnpm db:dev:up to create the local development credentials.}
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dayli_dev"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./dev/init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres-data:
    name: dayli-development-postgres-data
