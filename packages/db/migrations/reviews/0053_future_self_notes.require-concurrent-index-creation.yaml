reason: The indexes are built on new empty tables inside the atomic migration; concurrent creation would be incompatible with that transaction.
affected_data_and_clients: Owner and date, due-note scan, idempotency note and delivery lease indexes on empty tables; no populated-table write path is blocked.
rollout_sequence: Apply atomically, verify the tables locally, then promote through the protected workflow.
forward_fix_plan: Use a separately reviewed concurrent index migration if an index must later be added to a populated table.
backup_checkpoint: Confirm the required Neon restore point before protected-environment execution.
reviewer: Required database CODEOWNER review in the pull request before protected migration execution.
