reason: The migration is one atomic, forward-only Drizzle file applied once by the protected runner, which rolls the whole file back on failure. IF NOT EXISTS guards would hide a partially applied target.
affected_data_and_clients: Creates future_self_notes, future_self_note_idempotency_keys, future_self_note_deliveries and two enums; no existing table or data is changed.
rollout_sequence: Apply through the protected migration workflow before the Worker release that registers the future-self note routes and scheduled delivery.
forward_fix_plan: Stop on failure and inspect the target; add a new reviewed migration for any correction instead of editing this one.
backup_checkpoint: Confirm the required Neon restore point before protected-environment execution.
reviewer: Required database CODEOWNER review in the pull request before protected migration execution.
