reason: Better Auth 1.7.5's Drizzle schema requires an integer rate-limit count. The highest configured limit is ten attempts in one hour, far below the integer bound.
affected_data_and_clients: The new table has no existing rows. It records only authentication rate-limit counters.
rollout_sequence: Apply through the protected staging workflow, verify auth rate limiting, then promote after approval.
backup_checkpoint: Confirm the required Neon restore point before protected-environment execution.
forward_fix_plan: Add a new reviewed migration if Better Auth changes the required rate-limit column type.
reviewer: Required database CODEOWNER review in the pull request before protected migration execution.
