reason: The protected migrator sets a five-second PostgreSQL lock timeout before Drizzle executes this migration.
affected_data_and_clients: Adds nullable/defaulted columns and a check constraint to the existing media_reservation table from issue #21. Existing rows all default to status='pending' with null failure_reason/validated_at, which the new check constraint's first branch accepts exactly.
rollout_sequence: Apply through the protected staging workflow, verify the completion routes, then promote after approval.
backup_checkpoint: Confirm the required Neon restore point before protected-environment execution.
forward_fix_plan: Add a new reviewed migration if the media_reservation shape needs correction.
reviewer: Required database CODEOWNER review in the pull request before protected migration execution.
