reason: The protected migration runner sets a 5-minute statement timeout for every pending migration.
affected_data_and_clients: Only empty new tables are created, so no statement scans or rewrites existing data.
rollout_sequence: Apply through the protected migration workflow, which enforces the statement timeout, before the dependent Worker release.
forward_fix_plan: Retry after correcting the cause; if the definition is wrong, add a new reviewed migration.
backup_checkpoint: Confirm the required Neon restore point before protected-environment execution.
reviewer: Required database CODEOWNER review in the pull request before protected migration execution.
