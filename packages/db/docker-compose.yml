services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: dayli_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dayli_test"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - ./test/init:/docker-entrypoint-initdb.d:ro
