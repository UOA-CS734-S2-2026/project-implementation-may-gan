name: dayli_mobile
description: Dayli's Flutter client.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"
dependencies:
  dayli_api_client:
    path: ../../packages/api-client-dart
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  google_sign_in: ^7.2.0
  http: ^1.6.0
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  # Imported from the WDCC web frontend; see apps/web/ATTRIBUTION.md.
  assets:
    - assets/wdcc/
