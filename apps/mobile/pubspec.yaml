name: dayli_mobile
description: Dayli's Flutter client.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"
dependencies:
  dayli_api_client:
    path: ../../packages/api-client-dart
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.1
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  geocoding: ^5.0.0
  geolocator: ^14.1.1
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  google_sign_in: ^7.2.0
  http: ^1.6.0
  image_picker: ^1.2.3
  local_auth: ^2.3.0
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  record: ^7.1.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  v_video_compressor: ^2.2.3
  video_player: ^2.14.0
  web_socket_channel: ^3.0.3
dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  video_player_platform_interface: ^6.9.0
  image_picker_platform_interface: ^2.11.1
  plugin_platform_interface: ^2.1.8
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  local_auth_platform_interface: ^1.1.0
flutter:
  uses-material-design: true
  # Imported from the WDCC web frontend; see apps/web/ATTRIBUTION.md.
  assets:
    - assets/legal/
    - assets/wdcc/
